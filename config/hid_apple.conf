# Configuration for hid-apple kernel module (Apple Keyboards)
# Place in /etc/modprobe.d/hid_apple.conf

# fnmode:
# 0 = disabled (standard F1-F12 keys unusable)
# 1 = media keys by default (press Fn for F1-F12)
# 2 = F1-F12 keys by default (press Fn for media keys) [RECOMMENDED]
options hid_apple fnmode=2

# swap_opt_cmd:
# 0 = default (Option=Alt, Command=Super)
# 1 = swap Option and Command keys to mirror PC keyboard layout (Option=Super, Command=Alt)
options hid_apple swap_opt_cmd=1

# swap_fn_leftctrl:
# 0 = default
# 1 = swap Fn and Left Ctrl keys
options hid_apple swap_fn_leftctrl=0

# iso_layout:
# 0 = disable ISO layout fixes
# 1 = enable ISO layout fixes
options hid_apple iso_layout=1
