[general]
# mbpfan configuration file for Intel Mac laptops / iMacs
# Place in /etc/mbpfan.conf

# min_fan1_speed: minimum fan speed for fan 1 (leave -1 to auto-detect from /sys/devices)
min_fan1_speed = -1
max_fan1_speed = -1

# min_fan2_speed: minimum fan speed for fan 2 (if present)
min_fan2_speed = -1
max_fan2_speed = -1

# low_temp: temperature in C at which fans run at minimum speed
low_temp = 55

# high_temp: temperature in C at which fans start ramping up aggressively
high_temp = 65

# max_temp: temperature in C at which fans run at maximum speed
max_temp = 85

# polling_interval: delay between temperature checks in seconds
polling_interval = 2
